[project]
name = "kinwise-ring"
version = "0.1.0"
description = "Kinwise Ring worker: turns Ring Partner API activity into neutral, privacy-safe visitor events for the Kinwise hub"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kinwise team" }]
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.15",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=11",
    "playwright>=1.63.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
kinwise-ring = "kinwise_ring.cli:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic arrows/dashes in prose are intentional
    "S101",                         # asserts are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
