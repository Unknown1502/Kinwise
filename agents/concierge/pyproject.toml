[project]
name = "kinwise-concierge"
version = "0.1.0"
description = "Simulated Alexa+ orchestrator for Kinwise: a Strands agent on Bedrock AgentCore that uses the Kinwise MCP server on the user's behalf"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.57",
    "bedrock-agentcore>=1.24",
    "mcp>=2.0",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
kinwise-concierge = "kinwise_concierge.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinwise_concierge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
